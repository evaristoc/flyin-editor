name: GithubPages deployment

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deployment:
    name: GH-Pages deployment
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install nodejs dependencies
        run: |
          pwd
          ls -la
          npm install

      - name: Build
        permissions:
          pages: write
          id-token: write        
        run: |
          npm run build
          pwd
          ls -la

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build

    deploy:
      needs: Build
      permissions:
        pages: write
        id-token: write

      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4

