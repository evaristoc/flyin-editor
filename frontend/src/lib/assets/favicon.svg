<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <g stroke="#3A3F45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">

        <!-- Rotors (4 distinct matte colors: Red, Yellow, Green, Blue) -->
        <!-- Top-Left Rotor (Matte Red) -->
        <circle cx="62" cy="62" r="44" fill="#C8524B" />
        <line x1="62" y1="62" x2="73" y2="19" />
        <line x1="62" y1="62" x2="19" y2="73" />

        <!-- Top-Right Rotor (Matte Yellow) -->
        <circle cx="194" cy="62" r="44" fill="#E8C547" />
        <line x1="194" y1="62" x2="183" y2="19" />
        <line x1="194" y1="62" x2="237" y2="73" />

        <!-- Bottom-Left Rotor (Matte Green) -->
        <circle cx="62" cy="194" r="44" fill="#7EA868" />
        <line x1="62" y1="194" x2="19" y2="183" />
        <line x1="62" y1="194" x2="73" y2="237" />

        <!-- Bottom-Right Rotor (Matte Blue) -->
        <circle cx="194" cy="194" r="44" fill="#547AA5" />
        <line x1="194" y1="194" x2="237" y2="183" />
        <line x1="194" y1="194" x2="183" y2="237" />

        <!-- 4 Arms (Uniform Matte Slate-Grey) -->
        <!-- Top-Left Arm -->
        <polygon points="102,112 112,102 62,62" fill="#7E8691" />
        <line x1="107" y1="107" x2="62" y2="62" />

        <!-- Top-Right Arm -->
        <polygon points="144,102 154,112 194,62" fill="#7E8691" />
        <line x1="149" y1="107" x2="194" y2="62" />

        <!-- Bottom-Left Arm -->
        <polygon points="102,144 112,154 62,194" fill="#7E8691" />
        <line x1="107" y1="149" x2="62" y2="194" />

        <!-- Bottom-Right Arm -->
        <polygon points="154,144 144,154 194,194" fill="#7E8691" />
        <line x1="149" y1="149" x2="194" y2="194" />

        <!-- Rotor Hubs -->
        <circle cx="62" cy="62" r="12" fill="#7E8691" />
        <circle cx="62" cy="62" r="5" fill="#3A3F45" stroke="none" />

        <circle cx="194" cy="62" r="12" fill="#7E8691" />
        <circle cx="194" cy="62" r="5" fill="#3A3F45" stroke="none" />

        <circle cx="62" cy="194" r="12" fill="#7E8691" />
        <circle cx="62" cy="194" r="5" fill="#3A3F45" stroke="none" />

        <circle cx="194" cy="194" r="12" fill="#7E8691" />
        <circle cx="194" cy="194" r="5" fill="#3A3F45" stroke="none" />

        <!-- Center Body (Faceted Octagon in Matte Blue/Purple) -->
        <polygon points="118,90 138,90 156,112 156,144 138,166 118,166 100,144 100,112" fill="#5D78A8" />
        <!-- Low-poly facet lines -->
        <polyline points="118,90 112,128 118,166" fill="none" />
        <polyline points="138,90 144,128 138,166" fill="none" />
        <line x1="100" y1="128" x2="112" y2="128" />
        <line x1="144" y1="128" x2="156" y2="128" />

    </g>
</svg>
