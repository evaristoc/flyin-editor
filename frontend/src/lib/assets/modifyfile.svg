<svg xmlns="http://w3.org" viewBox="0 0 460 310" width="100%" height="100%" style="max-width: 520px; display: block; margin: auto;">
  <style>
    .title-text {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #334155;
      text-anchor: middle;
    }

    .panel-label {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #64748b;
    }

    /* Extra 4th Node (No Edge) */
    .extra-node {
      transform-origin: 230px 116px;
      animation: nodeLifecycle 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Existing Config Lines shifting when new line is reordered */
    .line-2 {
      animation: shiftLine2 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .line-3 {
      animation: shiftLine3 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* New Config Line: Insert -> Drag Up -> Delete */
    .new-line {
      animation: newLineLifecycle 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .new-line-bg {
      animation: newLineColor 8s ease-in-out infinite;
    }

    /* Typing Caret on Insert */
    .typing-caret {
      animation: caretBlink 8s step-end infinite;
    }

    /* Sketchy Hand Dragging the Line */
    .drag-hand {
      animation: handMove 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Node Lifecycle: Appears at 15%, stays steady through reorder, vanishes at 78% */
    @keyframes nodeLifecycle {
      0%, 12% { transform: scale(0); opacity: 0; }
      20%, 74% { transform: scale(1); opacity: 1; }
      82%, 100% { transform: scale(0); opacity: 0; }
    }

    /* New Line Lifecycle:
       0-10%: hidden
       15-35%: inserted at bottom (y=0 offset, base y=214)
       45-68%: dragged up by -32px (sits at y=182, between line 1 and line 2)
       75-82%: deleted (shrinks & fades out) */
    @keyframes newLineLifecycle {
      0%, 10% { transform: translate(0px, 0px) scaleX(0.2); opacity: 0; }
      18%, 35% { transform: translate(0px, 0px) scaleX(1); opacity: 1; }
      45%, 68% { transform: translate(0px, -32px) scaleX(1); opacity: 1; }
      75% { transform: translate(8px, -32px) scaleX(0.95); opacity: 0.8; }
      82%, 100% { transform: translate(16px, -32px) scaleX(0.2); opacity: 0; }
    }

    @keyframes newLineColor {
      0%, 68% { fill: #e0f2fe; stroke: #3b82f6; }
      73%, 82% { fill: #fee2e2; stroke: #ef4444; }
      100% { fill: #e0f2fe; stroke: #3b82f6; }
    }

    /* Line 2 & Line 3 shift down (+16px) when new line moves above them, then snap back on delete */
    @keyframes shiftLine2 {
      0%, 38% { transform: translateY(0px); }
      46%, 74% { transform: translateY(16px); }
      81%, 100% { transform: translateY(0px); }
    }

    @keyframes shiftLine3 {
      0%, 38% { transform: translateY(0px); }
      46%, 74% { transform: translateY(16px); }
      81%, 100% { transform: translateY(0px); }
    }

    /* Blinking text cursor during line creation */
    @keyframes caretBlink {
      0%, 7% { opacity: 0; }
      8%, 11%, 14%, 17% { opacity: 1; }
      10%, 13%, 16%, 19%, 100% { opacity: 0; }
    }

    /* Sketchy Hand appears to grab line at y=216, drags to y=184, then leaves */
    @keyframes handMove {
      0%, 30% { transform: translate(290px, 225px); opacity: 0; }
      35% { transform: translate(275px, 213px); opacity: 1; }
      45%, 60% { transform: translate(275px, 181px); opacity: 1; }
      66%, 100% { transform: translate(290px, 175px); opacity: 0; }
    }
  </style>

  <!-- Main Window Container -->
  <rect x="65" y="24" width="330" height="226" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2" />

  <!-- TOP PANEL: Graph Preview -->
  <text x="84" y="44" class="panel-label">GRAPH PREVIEW</text>
  <rect x="82" y="52" width="296" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Existing Connected Linear Graph (3 Nodes + 2 Edges) -->
  <g fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 171 80 H 210 M 205 75 L 211 80 L 205 85" />
    <path d="M 247 80 H 286 M 281 75 L 287 80 L 281 85" />
  </g>

  <g>
    <circle cx="155" cy="80" r="13" fill="#e0f2fe" stroke="#1e293b" stroke-width="2" />
    <circle cx="155" cy="80" r="3.5" fill="#3b82f6" />

    <circle cx="230" cy="80" r="13" fill="#e0f2fe" stroke="#1e293b" stroke-width="2" />
    <circle cx="230" cy="80" r="3.5" fill="#3b82f6" />

    <circle cx="305" cy="80" r="13" fill="#e0f2fe" stroke="#1e293b" stroke-width="2" />
    <circle cx="305" cy="80" r="3.5" fill="#3b82f6" />
  </g>

  <!-- New Unconnected Node (No Edge) -->
  <g class="extra-node">
    <circle cx="230" cy="116" r="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 2" />
    <circle cx="230" cy="116" r="3.5" fill="#3b82f6" />
  </g>

  <!-- Divider -->
  <line x1="65" y1="146" x2="395" y2="146" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- BOTTOM PANEL: Editable Config File View -->
  <text x="84" y="162" class="panel-label">CONFIG EDITOR</text>

  <!-- Static Line 1 -->
  <g transform="translate(84, 170)">
    <rect x="0" y="0" width="44" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="50" y="0" width="105" height="7" rx="3.5" fill="#cbd5e1" />
  </g>

  <!-- Line 2 (Shifts down during reorder) -->
  <g class="line-2">
    <g transform="translate(96, 186)">
      <rect x="0" y="0" width="52" height="7" rx="3.5" fill="#94a3b8" />
      <rect x="58" y="0" width="124" height="7" rx="3.5" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Line 3 (Shifts down during reorder) -->
  <g class="line-3">
    <g transform="translate(96, 202)">
      <rect x="0" y="0" width="38" height="7" rx="3.5" fill="#94a3b8" />
      <rect x="44" y="0" width="90" height="7" rx="3.5" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Blinking Insertion Caret -->
  <line class="typing-caret" x1="96" y1="215" x2="96" y2="226" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />

  <!-- New Added / Reordered / Removed Config Line -->
  <g class="new-line" style="transform-origin: 96px 220px;">
    <g transform="translate(92, 214)">
      <!-- Highlight Pill around the editable sentence -->
      <rect class="new-line-bg" x="0" y="0" width="186" height="13" rx="4" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1.4" />
      <!-- Sentence Blocks inside -->
      <rect x="6" y="3.5" width="46" height="6" rx="3" fill="#2563eb" />
      <rect x="58" y="3.5" width="92" height="6" rx="3" fill="#60a5fa" />
      <!-- Drag Handle Dots on right -->
      <circle cx="174" cy="4.5" r="1" fill="#3b82f6" />
      <circle cx="178" cy="4.5" r="1" fill="#3b82f6" />
      <circle cx="174" cy="8.5" r="1" fill="#3b82f6" />
      <circle cx="178" cy="8.5" r="1" fill="#3b82f6" />
    </g>
  </g>

  <!-- Sketchy Hand Icon for Dragging Line -->
  <g class="drag-hand" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 12 V 3 A 2.5 2.5 0 0 1 11 3 V 10 
             A 2.5 2.5 0 0 1 16 10 V 11 
             A 2.5 2.5 0 0 1 21 11 V 12 
             A 2.5 2.5 0 0 1 25 13 V 21 
             C 25 26 21 29 15 29 H 11 
             C 6 29 4 25 2 21 L 0 17 
             A 2.2 2.2 0 0 1 3.5 14.5 L 6 17 Z" />
  </g>

  <!-- Bottom Onboarding Label -->
  <text x="230" y="278" class="title-text">EDIT LINES TO UPDATE NODES</text>
</svg>
